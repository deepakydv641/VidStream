services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - vidstream-network
    restart: unless-stopped
  
  redis:
    image: redis:alpine
    container_name: redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vidstream-network
    

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - vidstream-network

  backend1:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-1
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

  backend2:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-2
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

  backend3:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-3
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

networks:
  vidstream-network:
    driver: bridge

volumes:
  elasticsearch_data:
    driver: local
