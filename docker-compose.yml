services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - vidstream-network
    restart: unless-stopped

  backend1:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-1
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

  backend2:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-2
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

  backend3:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vidstream-backend-3
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./Backend/public/temp:/app/public/temp
    networks:
      - vidstream-network
    restart: unless-stopped

networks:
  vidstream-network:
    driver: bridge
